<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CARA - Manage Products</title>

    <link rel="stylesheet"
          href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">

    <link rel="stylesheet" href="style.css">

    <style>

        .admin-container {
            width: 90%;
            margin: 50px auto;
        }

        .admin-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-form-container {
            max-width: 700px;
            margin: 0 auto 60px auto;
            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.1);
        }

        .product-form-container h2 {
            margin-bottom: 20px;
        }

        .product-form-container input,
        .product-form-container textarea {
            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 5px;
        }

        .product-form-container textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cancel-btn {
            display: none;

            background: #606063 !important;
        }

        .products-table-container {
            overflow-x: auto;
        }

        .products-table {
            width: 100%;

            border-collapse: collapse;

            min-width: 850px;
        }

        .products-table th,
        .products-table td {
            padding: 15px;

            border: 1px solid #e1e1e1;

            text-align: center;
        }

        .products-table th {
            background: #088178;
            color: white;
        }

        .products-table img {
            width: 70px;
            height: 70px;

            object-fit: cover;

            border-radius: 6px;
        }

        .action-btn {
            border: none;

            padding: 8px 12px;

            margin: 3px;

            border-radius: 4px;

            cursor: pointer;

            color: white;
        }

        .edit-btn {
            background: #088178;
        }

        .delete-btn {
            background: #c0392b;
        }

        .admin-message {
            text-align: center;

            padding: 30px;

            font-size: 17px;
        }

        .back-dashboard {
            display: inline-block;

            margin-bottom: 25px;

            color: #088178;

            font-weight: 600;

            text-decoration: none;
        }

        @media (max-width: 600px) {

            .admin-container {
                width: 95%;
            }

            .product-form-container {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- ========================================
         HEADER
    ======================================== -->

    <section id="header">

        <a href="index.html">

            <img
                src="Images/logo.png"
                class="logo"
                alt="CARA Logo">

        </a>


        <div>

            <ul id="navbar">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="shop.html">Shop</a>
                </li>

                <li>
                    <a href="blog.html">Blog</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

                <li>
                    <a href="orders.html">Orders</a>
                </li>

                <li>
                    <a
                        class="active"
                        href="admin.html">
                        Dashboard
                    </a>
                </li>

                <li id="lg-bag">

                    <a href="cart.html">

                        <i class="far fa-shopping-bag"></i>

                    </a>

                </li>

                <a href="#" id="close">

                    <i class="far fa-times"></i>

                </a>

            </ul>

        </div>


        <div id="mobile">

            <a href="cart.html">

                <i class="far fa-shopping-bag"></i>

            </a>

            <i
                id="bar"
                class="fas fa-outdent">
            </i>

        </div>

    </section>



    <!-- ========================================
         PAGE HEADER
    ======================================== -->

    <section
        id="page-header"
        class="about-header">

        <h2>#manage_products</h2>

        <p>
            Add, update and manage store inventory
        </p>

    </section>



    <!-- ========================================
         ADMIN CONTENT
    ======================================== -->

    <main class="admin-container">

        <a
            href="admin.html"
            class="back-dashboard">

            ← Back to Dashboard

        </a>


        <!-- ========================================
             PRODUCT FORM
        ======================================== -->

        <div class="product-form-container">

            <h2 id="formTitle">
                Add New Product
            </h2>


            <form id="productForm">


                <input
                    type="text"
                    id="name"
                    placeholder="Product Name"
                    required>


                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required>


                <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    min="0"
                    step="0.01"
                    required>


                <input
                    type="number"
                    id="stock"
                    placeholder="Stock"
                    min="0"
                    step="1"
                    required>


                <input
                    type="text"
                    id="image"
                    placeholder="Image path e.g. Images/f1.jpg"
                    required>


                <textarea
                    id="description"
                    placeholder="Product Description">
                </textarea>


                <div class="form-buttons">

                    <button
                        type="submit"
                        class="normal"
                        id="submitBtn">

                        Add Product

                    </button>


                    <button
                        type="button"
                        class="normal cancel-btn"
                        id="cancelEditBtn">

                        Cancel Edit

                    </button>

                </div>


            </form>

        </div>



        <!-- ========================================
             EXISTING PRODUCTS
        ======================================== -->

        <h2 class="admin-title">
            Existing Products
        </h2>


        <div class="products-table-container">

            <table class="products-table">

                <thead>

                    <tr>

                        <th>Image</th>

                        <th>Name</th>

                        <th>Category</th>

                        <th>Price</th>

                        <th>Stock</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="productsTableBody">

                    <tr>

                        <td
                            colspan="6"
                            class="admin-message">

                            Loading products...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>



    <script>

        const PRODUCT_API_URL =
            "http://localhost:5000/api/products";


        const ADMIN_API_URL =
            "http://localhost:5000/api/admin";


        const token =
            localStorage.getItem("token");


        let products = [];

        let editingProductId = null;



        // ========================================
        // VERIFY ADMIN
        // ========================================

        async function verifyAdmin() {

            if (!token) {

                alert(
                    "Please login to access product management."
                );

                window.location.href =
                    "login.html";

                return false;
            }


            try {

                const response =
                    await fetch(
                        `${ADMIN_API_URL}/dashboard`,
                        {

                            headers: {

                                "Authorization":
                                    `Bearer ${token}`

                            }

                        }
                    );


                if (response.status === 401) {

                    localStorage.removeItem(
                        "token"
                    );

                    localStorage.removeItem(
                        "user"
                    );

                    localStorage.removeItem(
                        "userName"
                    );


                    alert(
                        "Your login session has expired. Please login again."
                    );


                    window.location.href =
                        "login.html";


                    return false;
                }


                if (response.status === 403) {

                    alert(
                        "Access denied. Admin only."
                    );


                    window.location.href =
                        "index.html";


                    return false;
                }


                if (!response.ok) {

                    throw new Error(
                        "Unable to verify administrator"
                    );

                }


                return true;


            } catch (error) {

                console.error(
                    "Admin verification error:",
                    error
                );


                alert(
                    "Unable to verify administrator."
                );


                return false;
            }

        }



        // ========================================
        // LOAD PRODUCTS
        // ========================================

        async function loadProducts() {

            const tableBody =
                document.getElementById(
                    "productsTableBody"
                );


            try {

                const response =
                    await fetch(
                        PRODUCT_API_URL
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load products"
                    );

                }


                products =
                    await response.json();


                displayProducts();


            } catch (error) {

                console.error(
                    "Load products error:",
                    error
                );


                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="admin-message">

                            Unable to load products.

                        </td>

                    </tr>

                `;

            }

        }



        // ========================================
        // DISPLAY PRODUCTS
        // ========================================

        function displayProducts() {

            const tableBody =
                document.getElementById(
                    "productsTableBody"
                );


            if (products.length === 0) {

                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="admin-message">

                            No products found.

                        </td>

                    </tr>

                `;

                return;
            }


            tableBody.innerHTML = "";


            products.forEach(
                (product) => {


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>

                            <img
                                src="${product.image}"
                                alt="${product.name}">

                        </td>


                        <td>
                            ${product.name}
                        </td>


                        <td>
                            ${product.category}
                        </td>


                        <td>
                            $${Number(
                                product.price
                            ).toFixed(2)}
                        </td>


                        <td>
                            ${product.stock}
                        </td>


                        <td>

                            <button
                                type="button"
                                class="action-btn edit-btn">

                                Edit

                            </button>


                            <button
                                type="button"
                                class="action-btn delete-btn">

                                Delete

                            </button>

                        </td>

                    `;


                    row
                        .querySelector(
                            ".edit-btn"
                        )
                        .addEventListener(
                            "click",
                            function () {

                                startEdit(
                                    product._id
                                );

                            }
                        );


                    row
                        .querySelector(
                            ".delete-btn"
                        )
                        .addEventListener(
                            "click",
                            function () {

                                deleteProduct(
                                    product._id,
                                    product.name
                                );

                            }
                        );


                    tableBody.appendChild(
                        row
                    );

                }
            );

        }



        // ========================================
        // ADD / UPDATE PRODUCT
        // ========================================

        document
            .getElementById(
                "productForm"
            )
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const productData = {

                        name:
                            document
                                .getElementById(
                                    "name"
                                )
                                .value
                                .trim(),

                        category:
                            document
                                .getElementById(
                                    "category"
                                )
                                .value
                                .trim(),

                        price:
                            Number(
                                document
                                    .getElementById(
                                        "price"
                                    )
                                    .value
                            ),

                        stock:
                            Number(
                                document
                                    .getElementById(
                                        "stock"
                                    )
                                    .value
                            ),

                        image:
                            document
                                .getElementById(
                                    "image"
                                )
                                .value
                                .trim(),

                        description:
                            document
                                .getElementById(
                                    "description"
                                )
                                .value
                                .trim()

                    };


                    if (
                        productData.price < 0 ||
                        productData.stock < 0
                    ) {

                        alert(
                            "Price and stock cannot be negative."
                        );

                        return;
                    }


                    const isEditing =
                        Boolean(
                            editingProductId
                        );


                    const url =
                        isEditing

                            ? `${PRODUCT_API_URL}/${editingProductId}`

                            : PRODUCT_API_URL;


                    const method =
                        isEditing
                            ? "PUT"
                            : "POST";


                    const submitButton =
                        document.getElementById(
                            "submitBtn"
                        );


                    try {

                        submitButton.disabled =
                            true;


                        submitButton.textContent =
                            isEditing
                                ? "Updating..."
                                : "Adding...";


                        const response =
                            await fetch(
                                url,
                                {

                                    method,


                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            `Bearer ${token}`

                                    },


                                    body:
                                        JSON.stringify(
                                            productData
                                        )

                                }
                            );


                        const data =
                            await response.json();


                        if (response.status === 401) {

                            alert(
                                "Your login session has expired."
                            );


                            window.location.href =
                                "login.html";


                            return;
                        }


                        if (response.status === 403) {

                            alert(
                                "Access denied. Admin only."
                            );


                            window.location.href =
                                "index.html";


                            return;
                        }


                        if (!response.ok) {

                            alert(
                                data.message ||
                                "Unable to save product."
                            );

                            return;
                        }


                        alert(
                            isEditing
                                ? "Product updated successfully!"
                                : "Product added successfully!"
                        );


                        resetForm();


                        await loadProducts();


                    } catch (error) {

                        console.error(
                            "Save product error:",
                            error
                        );


                        alert(
                            "Unable to save product."
                        );


                    } finally {

                        submitButton.disabled =
                            false;


                        submitButton.textContent =
                            editingProductId
                                ? "Update Product"
                                : "Add Product";

                    }

                }
            );



        // ========================================
        // START EDIT
        // ========================================

        function startEdit(productId) {

            const product =
                products.find(
                    (item) =>
                        item._id ===
                        productId
                );


            if (!product) {

                alert(
                    "Product not found."
                );

                return;
            }


            editingProductId =
                product._id;


            document.getElementById(
                "name"
            ).value =
                product.name;


            document.getElementById(
                "category"
            ).value =
                product.category;


            document.getElementById(
                "price"
            ).value =
                product.price;


            document.getElementById(
                "stock"
            ).value =
                product.stock;


            document.getElementById(
                "image"
            ).value =
                product.image;


            document.getElementById(
                "description"
            ).value =
                product.description || "";


            document.getElementById(
                "formTitle"
            ).textContent =
                "Edit Product";


            document.getElementById(
                "submitBtn"
            ).textContent =
                "Update Product";


            document.getElementById(
                "cancelEditBtn"
            ).style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }



        // ========================================
        // CANCEL EDIT
        // ========================================

        document
            .getElementById(
                "cancelEditBtn"
            )
            .addEventListener(
                "click",
                resetForm
            );



        // ========================================
        // RESET FORM
        // ========================================

        function resetForm() {

            editingProductId = null;


            document.getElementById(
                "productForm"
            ).reset();


            document.getElementById(
                "formTitle"
            ).textContent =
                "Add New Product";


            document.getElementById(
                "submitBtn"
            ).textContent =
                "Add Product";


            document.getElementById(
                "cancelEditBtn"
            ).style.display =
                "none";

        }



        // ========================================
        // DELETE PRODUCT
        // ========================================

        async function deleteProduct(
            productId,
            productName
        ) {

            const confirmed =
                confirm(
                    `Delete "${productName}"?`
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${PRODUCT_API_URL}/${productId}`,
                        {

                            method: "DELETE",


                            headers: {

                                "Authorization":
                                    `Bearer ${token}`

                            }

                        }
                    );


                const data =
                    await response.json();


                if (response.status === 401) {

                    alert(
                        "Your login session has expired."
                    );


                    window.location.href =
                        "login.html";


                    return;
                }


                if (response.status === 403) {

                    alert(
                        "Access denied. Admin only."
                    );


                    window.location.href =
                        "index.html";


                    return;
                }


                if (!response.ok) {

                    alert(
                        data.message ||
                        "Unable to delete product."
                    );

                    return;
                }


                alert(
                    "Product deleted successfully!"
                );


                await loadProducts();


            } catch (error) {

                console.error(
                    "Delete product error:",
                    error
                );


                alert(
                    "Unable to delete product."
                );

            }

        }



        // ========================================
        // START PAGE
        // ========================================

        async function startPage() {

            const isAdmin =
                await verifyAdmin();


            if (!isAdmin) {
                return;
            }


            await loadProducts();

        }


        startPage();

    </script>


    <script src="script.js"></script>

</body>

</html>
